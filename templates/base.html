<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SubTracker</title>
    <style>
        :root {
            color-scheme: light;
            --primary: #6c5ce7;
            --primary-dark: #5a4bd1;
            --danger: #e74c3c;
            --success: #2ecc71;
            --warning: #f39c12;
            --bg: #f4f5fb;
            --card-bg: #ffffff;
            --text: #2d2d3a;
            --text-muted: #8a8a9a;
            --border: #e6e6f0;
            --secondary-bg: #eceef7;
            --secondary-text: #2d2d3a;
        }

        html.dark {
            color-scheme: dark;
            --primary: #a29bfe;
            --primary-dark: #8b7cf6;
            --bg: #1c1c26;
            --card-bg: #262632;
            --text: #eaeaf2;
            --text-muted: #9a9ab0;
            --border: #34344a;
            --secondary-bg: #34344a;
            --secondary-text: #eaeaf2;
        }

        * { box-sizing: border-box; }

        body {
            font-family: "Segoe UI", Arial, sans-serif;
            max-width: 720px;
            margin: 0 auto;
            padding: 0 16px 60px;
            color: var(--text);
            background: var(--bg);
            transition: background 0.2s ease, color 0.2s ease;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 24px 0;
        }

        .topbar h1 {
            margin: 0;
            font-size: 26px;
            background: linear-gradient(135deg, #6c5ce7, #a29bfe);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .topbar .user-info {
            font-size: 14px;
            color: var(--text-muted);
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .topbar a { color: var(--primary); text-decoration: none; transition: color 0.15s ease; }
        .topbar a:hover { color: var(--primary-dark); text-decoration: underline; }

        .theme-toggle {
            background: var(--secondary-bg);
            color: var(--secondary-text);
            border: none;
            border-radius: 8px;
            padding: 6px 10px;
            cursor: pointer;
            font-size: 15px;
            transition: transform 0.15s ease;
        }

        .theme-toggle:hover { transform: rotate(15deg); }

        .card {
            background: var(--card-bg);
            border-radius: 14px;
            padding: 24px;
            box-shadow: 0 2px 10px rgba(40, 40, 80, 0.08);
            animation: fadeIn 0.35s ease;
        }

        .total {
            font-size: 20px;
            margin-bottom: 16px;
            padding: 16px 20px;
            background: linear-gradient(135deg, #6c5ce7, #a29bfe);
            color: white;
            border-radius: 12px;
            box-shadow: 0 4px 14px rgba(108, 92, 231, 0.3);
        }

        .breakdown {
            margin-bottom: 20px;
            padding: 14px 18px;
            display: flex;
            gap: 18px;
            flex-wrap: wrap;
            font-size: 14px;
        }

        .breakdown-item { color: var(--text-muted); }
        .breakdown-item b { color: var(--text); }

        .filters {
            margin-bottom: 20px;
            padding: 14px 16px;
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 1px 6px rgba(40, 40, 80, 0.06);
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }

        select, input[type="text"], input[type="number"], input[type="date"], input[type="password"], input[type="email"] {
            padding: 8px 10px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            background: var(--card-bg);
            color: var(--text);
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }

        select:focus, input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(108, 92, 231, 0.2);
        }

        .btn {
            display: inline-block;
            padding: 9px 16px;
            border-radius: 8px;
            border: none;
            font-size: 14px;
            cursor: pointer;
            text-decoration: none;
            transition: transform 0.12s ease, box-shadow 0.12s ease, opacity 0.12s ease;
        }

        .btn:hover { transform: translateY(-1px); opacity: 0.92; }
        .btn:active { transform: translateY(0); }

        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { box-shadow: 0 4px 12px rgba(108, 92, 231, 0.35); }
        .btn-secondary { background: var(--secondary-bg); color: var(--secondary-text); }
        .btn-danger { background: var(--danger); color: white; }
        .btn-danger:hover { box-shadow: 0 4px 12px rgba(231, 76, 60, 0.35); }

        .sub-item {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 16px 18px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 1px 6px rgba(40, 40, 80, 0.06);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            animation: fadeIn 0.3s ease;
        }

        .sub-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(40, 40, 80, 0.12);
        }

        .sub-info b { font-size: 16px; }
        .sub-meta { color: var(--text-muted); font-size: 13px; margin-top: 4px; }

        .status {
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 12px;
            color: white;
            margin-left: 8px;
            display: inline-block;
        }

        .status-ok { background: var(--success); }
        .status-soon { background: var(--warning); }
        .status-overdue { background: var(--danger); }

        .actions { display: flex; align-items: center; }
        .actions a, .pay-link {
            margin-left: 12px;
            font-size: 13px;
            text-decoration: none;
            color: var(--primary);
            transition: color 0.15s ease;
        }

        .pay-link {
            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
            font-family: inherit;
        }

        .actions a:hover, .pay-link:hover { color: var(--primary-dark); text-decoration: underline; }
        .actions a.danger-link { color: var(--danger); }
        .actions a.danger-link:hover { color: #c0392b; }

        .danger-link { color: var(--danger); text-decoration: none; }
        .danger-link:hover { color: #c0392b; text-decoration: underline; }

        .add-btn {
            display: inline-block;
            padding: 10px 18px;
            background: var(--primary);
            color: white;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 500;
            box-shadow: 0 4px 12px rgba(108, 92, 231, 0.25);
            transition: transform 0.12s ease, box-shadow 0.12s ease;
        }

        .add-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(108, 92, 231, 0.35); }

        .empty { color: var(--text-muted); margin-top: 24px; text-align: center; }

        form p { margin: 12px 0; }
        form p label { display: block; margin-bottom: 5px; font-size: 14px; color: var(--text-muted); }

        .payments-table { width: 100%; border-collapse: collapse; margin-top: 16px; }
        .payments-table th, .payments-table td {
            text-align: left;
            padding: 10px 8px;
            border-bottom: 1px solid var(--border);
            font-size: 14px;
        }
        .payments-table th { color: var(--text-muted); font-weight: 500; }
    </style>
    <script>
        // Применяем сохранённую тему до отрисовки body, чтобы не было "мигания"
        if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.classList.add('dark');
        }
    </script>
</head>
<body>
    <div class="topbar">
        <h1>SubTracker</h1>
        {% if user.is_authenticated %}
            <div class="user-info">
                <span>{{ user.username }}</span>
                <a href="{% url 'payment_history' %}">История платежей</a>
                <a href="{% url 'account_delete' %}">Удалить аккаунт</a>
                <a href="{% url 'logout' %}">Выйти</a>
                <button class="theme-toggle" onclick="toggleTheme()" title="Переключить тему">🌓</button>
            </div>
        {% endif %}
    </div>
    {% block content %}{% endblock %}

    <script>
        function toggleTheme() {
            document.documentElement.classList.toggle('dark');
            localStorage.setItem('theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
        }
    </script>
</body>
</html>
