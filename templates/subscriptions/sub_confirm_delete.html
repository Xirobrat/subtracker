{% extends "base.html" %}
{% block content %}
    <div class="card">
        <h2>Удалить подписку «{{ subscription.title }}»?</h2>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Да, удалить</button>
            <a href="{% url 'sub_list' %}" class="btn btn-secondary">Отмена</a>
        </form>
    </div>
{% endblock %}
